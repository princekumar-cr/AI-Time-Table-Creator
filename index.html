<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Timetable - Secure Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e' } } } } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .modal { @apply fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300; }
        .modal.open { @apply opacity-100 pointer-events-auto; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white dark:bg-slate-800 p-10 rounded-[2.5rem] shadow-2xl border border-slate-100 dark:border-slate-700 relative">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-primary-600 rounded-3xl text-white shadow-xl shadow-primary-500/30 mb-6 transform rotate-3"><i class="fas fa-calendar-alt text-4xl"></i></div>
            <h1 class="text-3xl font-black text-slate-900 dark:text-white">AI Timetable</h1>
            <p class="text-slate-500 dark:text-slate-400 font-bold uppercase tracking-widest text-[10px] mt-2">Professional Scheduler</p>
        </div>
        <form id="login-form" class="space-y-6">
            <input type="email" id="login-email" required class="w-full px-5 py-3.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none focus:ring-4 focus:ring-primary-500/10 transition-all font-medium" placeholder="name@college.edu">
            <input type="password" id="login-password" required class="w-full px-5 py-3.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none focus:ring-4 focus:ring-primary-500/10 transition-all font-medium" placeholder="••••••••">
            <button type="submit" class="w-full py-4 bg-primary-600 hover:bg-primary-700 text-white font-black rounded-2xl shadow-xl shadow-primary-500/20 transform active:scale-95 transition-all">Sign In</button>
        </form>
        <div class="mt-10 text-center"><button id="open-register" class="text-sm font-bold text-primary-600 hover:underline">Create Account</button></div>
    </div>

    <div id="register-modal" class="modal">
        <div class="max-w-md w-full bg-white dark:bg-slate-800 p-10 rounded-[2.5rem] shadow-2xl relative">
            <button id="close-register" class="absolute top-6 right-6 text-slate-400 hover:text-slate-900"><i class="fas fa-times text-xl"></i></button>
            <h2 class="text-3xl font-black text-slate-900 dark:text-white mb-8">Register</h2>
            <form id="register-form" class="space-y-6">
                <input type="text" id="reg-name" required class="w-full px-5 py-3.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none" placeholder="Full Name">
                <input type="email" id="reg-email" required class="w-full px-5 py-3.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none" placeholder="Email">
                <input type="password" id="reg-password" required class="w-full px-5 py-3.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none" placeholder="Password">
                <button type="submit" class="w-full py-4 bg-slate-900 dark:bg-white dark:text-slate-900 text-white font-black rounded-2xl shadow-xl">Register Now</button>
            </form>
        </div>
    </div>
    <script src="frontend.js"></script>
</body>
</html>
