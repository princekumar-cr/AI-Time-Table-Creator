<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Timetable Creator | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; @apply bg-slate-50 dark:bg-slate-950 transition-colors duration-500; }
        .glass-card { @apply bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border border-white/20 dark:border-slate-800 shadow-[0_20px_50px_rgba(0,0,0,0.05)]; }
        .input-premium { @apply w-full px-5 py-4 bg-slate-100/50 dark:bg-slate-800/50 border border-transparent rounded-2xl outline-none focus:bg-white dark:focus:bg-slate-800 focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition-all font-semibold text-slate-900 dark:text-white; }
        .btn-primary { @apply w-full py-4 bg-primary-600 hover:bg-primary-700 text-white font-black rounded-2xl shadow-xl shadow-primary-500/30 transform active:scale-[0.98] transition-all flex items-center justify-center space-x-2; }
        
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full fade-in">
        <!-- Logo -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-primary-500 to-indigo-600 rounded-3xl text-white shadow-2xl shadow-primary-500/40 mb-6 transform rotate-3">
                <i class="fas fa-calendar-alt text-4xl"></i>
            </div>
            <h1 class="text-4xl font-black text-slate-900 dark:text-white tracking-tighter">AI Timetable</h1>
            <p class="text-slate-500 dark:text-slate-400 font-bold uppercase tracking-[0.2em] text-[10px] mt-2">Enterprise Academic Suite</p>
        </div>

        <!-- Forms Container -->
        <div class="glass-card p-10 rounded-[2.5rem] relative overflow-hidden">
            
            <!-- Login Form -->
            <div id="login-section">
                <h2 class="text-2xl font-black text-slate-900 dark:text-white mb-8">Access Dashboard</h2>
                <form id="login-form" class="space-y-6">
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-400 tracking-widest mb-2 ml-1">Work Email</label>
                        <input type="email" id="login-email" required class="input-premium" placeholder="admin@university.edu">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-400 tracking-widest mb-2 ml-1">Password</label>
                        <input type="password" id="login-password" required class="input-premium" placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-primary">
                        <span>Sign In</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>
                <p class="mt-8 text-center text-sm font-bold text-slate-500">
                    New institution? <button onclick="toggleForms()" class="text-primary-600 hover:underline">Register Account</button>
                </p>
            </div>

            <!-- Register Form (Hidden by default) -->
            <div id="register-section" class="hidden">
                <h2 class="text-2xl font-black text-slate-900 dark:text-white mb-8">Create Account</h2>
                <form id="register-form" class="space-y-5">
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-400 tracking-widest mb-2 ml-1">Admin Name</label>
                        <input type="text" id="reg-name" required class="input-premium" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-400 tracking-widest mb-2 ml-1">Institutional Email</label>
                        <input type="email" id="reg-email" required class="input-premium" placeholder="admin@college.edu">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-400 tracking-widest mb-2 ml-1">Secure Password</label>
                        <input type="password" id="reg-password" required class="input-premium" placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-primary">
                        <span>Create Account</span>
                        <i class="fas fa-user-plus"></i>
                    </button>
                </form>
                <p class="mt-8 text-center text-sm font-bold text-slate-500">
                    Already registered? <button onclick="toggleForms()" class="text-primary-600 hover:underline">Sign In</button>
                </p>
            </div>

        </div>

        <!-- Footer Actions -->
        <div class="mt-10 flex items-center justify-center space-x-6">
            <button id="theme-toggle" class="w-12 h-12 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-center justify-center text-slate-500 hover:scale-110 transition-all shadow-sm">
                <i id="theme-toggle-dark-icon" class="hidden fas fa-moon"></i>
                <i id="theme-toggle-light-icon" class="hidden fas fa-sun"></i>
            </button>
            <p class="text-xs font-black text-slate-400 uppercase tracking-widest">© 2026 AI TIMETABLE CREATOR</p>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
